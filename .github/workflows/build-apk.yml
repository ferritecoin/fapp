name: Build Android APK

# Tests first; then, at once, a release-signed .apk built with Buildozer on
# an Ubuntu runner (GitHub runners can reach the Android SDK host
# dl.google.com that Buildozer downloads from) and the Windows .exe built
# with Nuitka on a Windows runner; then a GitHub Release that carries the
# deliverables: the Android APK, the Windows executable and the desktop
# Python client. Every branch is tested and built (in a private repository,
# the executable on the default branch only); only the default branch
# publishes, and each version only once, so a release's files never change
# after the fact (tools/publish_release.sh).
#
# Signing:
#   * If you set the repo secrets FEXT_KEYSTORE_B64 / FEXT_KEYSTORE_PASSWORD /
#     FEXT_KEY_ALIAS / FEXT_KEY_PASSWORD, the release is signed with THAT
#     keystore (a persistent key you own — required so future updates install
#     over this one; this is the proper production setup).
#   * Otherwise the workflow generates an ephemeral keystore just for the build,
#     so you still get a properly release-signed, installable APK, as the
#     run's artifact. The default branch publishes no Release with it: no later
#     release could install over one. No key material is ever committed to the
#     repo.

on:
  push:
    branches:
      - "**"
    # The private record changes no deliverable: no build for it.
    paths-ignore:
      - ".private/**"
  workflow_dispatch:

permissions:
  contents: write        # needed to create/update the GitHub Release

jobs:
  tests:
    name: Client test suites (headless)
    # Pinned: the native Android build (python-for-android 2024.01.21 and the
    # apt packages it needs) has only ever run on 24.04, and ubuntu-latest
    # moves on. Both jobs use the same image.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout (with tags, for the previous-release compatibility tests)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install a virtual display and the client's dependencies
        run: |
          sudo apt-get update
          # libopus0: calls are tested in Opus (v11), as computers with it
          # call; the APK builds its own (recipes/libopus).
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1 libgl1-mesa-dri libmtdev1 xclip libopus0
          python -m pip install --upgrade pip
          pip install "kivy[base]==2.3.1" requests urllib3 charset-normalizer \
            idna certifi websocket-client cryptography qrcode pillow

      - name: Version in main.py matches buildozer.spec
        run: |
          SPEC=$(grep -E '^version' buildozer.spec | head -1 | sed -E 's/.*=[[:space:]]*//')
          CODE=$(grep -E '^APP_VERSION = ' main.py | sed -E 's/.*"(.*)".*/\1/')
          echo "spec=$SPEC main.py=$CODE"
          test "$SPEC" = "$CODE"

      - name: Run the suites
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          # The suites end with os._exit, which drops what is still in a
          # buffer: unbuffered, a failing check's line reaches the log.
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          # The newest release before this version: compatibility is checked
          # against that release's REAL code, in both directions. A tag of
          # this same version (a build of it published earlier) is not one.
          VER="$(grep -E '^version' buildozer.spec | head -1 | sed -E 's/.*=[[:space:]]*//')"
          OLD=""
          PREV=""
          for t in $(git tag --list 'v*' --sort=-v:refname); do
            if [ "${t#v}" != "$VER" ] &&
               [ "$(printf '%s\n%s\n' "${t#v}" "$VER" | sort -V | head -1)" = "${t#v}" ]; then
              PREV="$t"; break
            fi
          done
          if [ -n "$PREV" ] && git show "$PREV:main.py" > "$RUNNER_TEMP/old_main.py" 2>/dev/null; then
            OLD="$RUNNER_TEMP/old_main.py"; echo "compatibility baseline: $PREV"
          fi
          python desktop/test_service.py main.py
          xvfb-run -a python desktop/test_core.py main.py $OLD
          xvfb-run -a python desktop/test_flows.py main.py
          xvfb-run -a python desktop/test_design.py main.py
          xvfb-run -a python desktop/test_composer.py main.py
          xvfb-run -a python desktop/test_bundle.py main.py
          xvfb-run -a python desktop/smoke_desktop.py main.py
          xvfb-run -a python desktop/smoke_chat.py main.py
          xvfb-run -a python desktop/test_navigation.py main.py
          xvfb-run -a python desktop/test_pictures.py main.py
          xvfb-run -a python desktop/test_calls.py main.py
          xvfb-run -a python desktop/test_notify.py main.py
          xvfb-run -a python desktop/test_gestures.py main.py
          xvfb-run -a python desktop/test_privacy.py main.py

  build-windows:
    name: Nuitka (Windows EXE)
    needs: tests
    # A private repository pays for Windows minutes at twice the Linux rate:
    # there it is built on the default branch only. A public one (fapp)
    # builds it on every push.
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      || !github.event.repository.private
    # Pinned, as the Ubuntu jobs are: the build and its smoke test have run
    # on this image.
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      # Published only where the APK is, so no Release lacks its APK.
      HAS_KEY: ${{ secrets.FEXT_KEYSTORE_B64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Nuitka, the client's packages and the desktop extras
        run: |
          python -m pip install --upgrade pip
          # The extras are what the README lists for computers: calls in
          # Opus (pyogg), the microphone and speaker chosen (sounddevice),
          # voice notes at 1.5x and 2x (numpy), phones' voice notes played
          # (av), QR codes read from a picture (pyzbar).
          pip install nuitka==4.3.4 zstandard "kivy[base]==2.3.1" requests \
            urllib3 charset-normalizer idna certifi websocket-client \
            cryptography qrcode pillow sounddevice numpy av pyzbar pyogg

      # Nuitka's caches, the compiled C above all: compiling it is most of
      # the build's hour. Later builds compile only what changed.
      - name: Restore Nuitka's caches
        id: nuitka-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/nuitka-cache
          key: nuitka-windows-${{ hashFiles('main.py', 'desktop/build_desktop.sh', 'desktop/nuitka-package.config.yml') }}
          restore-keys: nuitka-windows-

      - name: Build the Windows executable
        id: exe
        env:
          NUITKA_CACHE_DIR: ${{ runner.temp }}/nuitka-cache
        run: |
          set -euo pipefail
          VER="$(grep -E '^version' buildozer.spec | head -1 | sed -E 's/.*=[[:space:]]*//')"
          TITLE="$(grep -E '^title' buildozer.spec | head -1 | sed -E 's/.*=[[:space:]]*//')"
          EXE="${TITLE}-${VER}-windows.exe"
          ONEFILE=1 PY=python OUT="$PWD/release" NAME="$EXE" \
            bash desktop/build_desktop.sh
          ls -la release/
          echo "exe=release/$EXE" >> "$GITHUB_OUTPUT"

      # Kept as soon as the build succeeds, so that a failed start below does
      # not cost the next build the hour again.
      - name: Keep Nuitka's caches
        if: steps.nuitka-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/nuitka-cache
          key: ${{ steps.nuitka-cache.outputs.cache-primary-key }}

      - name: Start it as a person would
        env:
          # The runner has no graphics card: Kivy draws through ANGLE
          # (Direct3D, which Windows renders in software) instead of OpenGL.
          KIVY_GL_BACKEND: angle_sdl2
        run: python desktop/smoke_exe.py "${{ steps.exe.outputs.exe }}" smoke_exe

      - name: Keep the screenshots and logs of those starts
        if: always()
        uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          name: windows-smoke
          path: smoke_exe/
          retention-days: 7

      # Even when a start failed, so that it can be looked at.
      - name: Upload the executable as a workflow artifact
        if: always() && steps.exe.outcome == 'success'
        uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          name: ferritext-windows
          path: ${{ steps.exe.outputs.exe }}
          if-no-files-found: error
          retention-days: 7

      - name: Publish to a GitHub Release
        if: success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        run: bash tools/publish_release.sh "${{ steps.exe.outputs.exe }}"

  build-android:
    name: Buildozer (release APK)
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache git zip unzip autoconf automake libtool \
            libltdl-dev pkg-config zlib1g-dev libncurses-dev cmake \
            libffi-dev libssl-dev
          # autoconf + automake (aclocal) + libltdl-dev (LT_SYS_SYMBOL_USCORE)
          # are all required to autoreconf libffi (a cffi/cryptography dep).

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install "buildozer==1.5.0" "cython==0.29.33"

      - name: Cache Buildozer SDK/NDK and p4a
        uses: actions/cache@v5
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Pre-fetch FreeType from either of its official hosts
        run: |
          set -euo pipefail
          # python-for-android downloads FreeType from download.savannah.gnu.org
          # alone, and a build has failed after 11 minutes on that host being
          # unreachable. Seed its download cache (the file plus the .mark-
          # file that tells it the download completed) from savannah or from
          # SourceForge, FreeType's other official host — pinned by sha256,
          # so either host is enough and neither has to be trusted blindly.
          ARCHS="$(grep -E '^android.archs' buildozer.spec | sed -E 's/.*=//; s/[[:space:]]//g; s/,/_/g')"
          PKG=".buildozer/android/platform/build-${ARCHS}/packages/freetype"
          FILE="freetype-2.10.1.tar.gz"
          SHA="3a60d391fd579440561bf0e7f31af2222bc610ad6ce4d9d7bd2165bca8669110"
          mkdir -p "$PKG"
          for URL in "https://download.savannah.gnu.org/releases/freetype/$FILE" \
                     "https://sourceforge.net/projects/freetype/files/freetype2/2.10.1/$FILE/download"; do
            if curl -fsSL --retry 3 --connect-timeout 20 --max-time 300 -o "$PKG/$FILE" "$URL" \
                && echo "$SHA  $PKG/$FILE" | sha256sum -c --quiet -; then
              touch "$PKG/.mark-$FILE"
              echo "FreeType $FILE from $URL (sha256 verified)"
              exit 0
            fi
            rm -f "$PKG/$FILE"
          done
          echo "::warning::Could not pre-fetch FreeType; python-for-android will try savannah itself"

      - name: Build & sign the release APK
        env:
          FEXT_KEYSTORE_B64: ${{ secrets.FEXT_KEYSTORE_B64 }}
          FEXT_KEYSTORE_PASSWORD: ${{ secrets.FEXT_KEYSTORE_PASSWORD }}
          FEXT_KEY_ALIAS: ${{ secrets.FEXT_KEY_ALIAS }}
          FEXT_KEY_PASSWORD: ${{ secrets.FEXT_KEY_PASSWORD }}
          # A repository variable, not a secret: the fingerprint of the one
          # key every repository that publishes Ferritext signs with.
          FEXT_KEY_SHA256: ${{ vars.FEXT_KEY_SHA256 }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/fext-release.keystore"
          if [ -n "${FEXT_KEYSTORE_B64:-}" ]; then
            echo "::notice::Signing with the keystore from repository secrets (persistent key)."
            # A pasted secret can carry line breaks, spaces or a Windows CR
            # (PowerShell, Notepad); none of them is base64, so drop them.
            if ! printf '%s' "$FEXT_KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > "$KS" 2>/dev/null; then
              echo "::error::FEXT_KEYSTORE_B64 is not valid base64. Encode the .keystore file again (README: Release signing)."
              exit 1
            fi
            STOREPASS="$(printf '%s' "${FEXT_KEYSTORE_PASSWORD:-}" | tr -d '\r\n')"
            KEYPASS="$(printf '%s' "${FEXT_KEY_PASSWORD:-${FEXT_KEYSTORE_PASSWORD:-}}" | tr -d '\r\n')"
            ALIAS="$(printf '%s' "${FEXT_KEY_ALIAS:-fext}" | tr -d ' \r\n\t')"
            # Fail in seconds, naming the secret to fix, not after the build.
            . tools/check_keystore.sh
            check_keystore "$KS" "$ALIAS"
          else
            echo "::warning::No signing secrets set - generating an ephemeral keystore for this build. Add FEXT_KEYSTORE_B64/PASSWORD/ALIAS secrets for a persistent key so future updates install over this release."
            STOREPASS="$(openssl rand -hex 24)"
            KEYPASS="$STOREPASS"
            ALIAS="fext"
            keytool -genkeypair -v -keystore "$KS" -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STOREPASS" -keypass "$KEYPASS" \
              -dname "CN=FEXT Client, OU=FEXT, O=FEXT, C=SG"
            echo "FEXT_THROWAWAY_KEY=1" >> "$GITHUB_ENV"
          fi
          export P4A_RELEASE_KEYSTORE="$KS"
          export P4A_RELEASE_KEYSTORE_PASSWD="$STOREPASS"
          export P4A_RELEASE_KEYALIAS="$ALIAS"
          export P4A_RELEASE_KEYALIAS_PASSWD="$KEYPASS"
          buildozer android release
          echo "Built:"; ls -la bin/

      - name: Name the deliverables
        id: assets
        run: |
          set -euo pipefail
          VER="$(grep -E '^version' buildozer.spec | head -1 | sed -E 's/.*=[[:space:]]*//')"
          TITLE="$(grep -E '^title' buildozer.spec | head -1 | sed -E 's/.*=[[:space:]]*//')"
          mkdir -p release
          cp "$(ls bin/*-release.apk | head -1)" "release/${TITLE}-${VER}.apk"
          # The desktop client is main.py with its fonts and window icons
          # appended (Kivy cannot fall back to another font, so without the
          # bundled serif a computer shows no emoji) — then checked against
          # main.py and data/ byte for byte, as anyone can check it.
          python3 tools/bundle_desktop.py "release/${TITLE}-${VER}-desktop.py"
          python3 tools/bundle_desktop.py --verify "release/${TITLE}-${VER}-desktop.py"
          ls -la release/
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Upload the deliverables as a workflow artifact
        if: success()
        uses: actions/upload-artifact@v6
        # Kept a week: the Releases keep every version. A full artifact quota
        # leaves a warning here, not a failed build without its Release.
        continue-on-error: true
        with:
          name: ferritext-release
          path: release/*
          if-no-files-found: error
          retention-days: 7

      - name: Publish to a GitHub Release
        # Only from the default branch: other branches are tested and built
        # but publish nothing.
        if: success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
          VER: ${{ steps.assets.outputs.ver }}
        run: |
          set -euo pipefail
          if [ "${FEXT_THROWAWAY_KEY:-}" = 1 ]; then
            echo "::error::Not publishing v$VER: this APK is signed with a throwaway key, and no later release could install over it. Add the FEXT_KEYSTORE_B64, FEXT_KEYSTORE_PASSWORD, FEXT_KEY_ALIAS and FEXT_KEY_PASSWORD secrets (README: Release signing), then re-run this build."
            exit 1
          fi
          bash tools/publish_release.sh release/*

      - name: Keep every release's commit citation on its tag
        if: success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Each release's notes name the commit it was built from. Should
          # history ever be rewritten (tags moved onto rewritten commits),
          # this points each one at its tag's commit again. Idempotent.
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq '.[] | [.id, .tag_name] | @tsv' |
          while IFS=$'\t' read -r id tag; do
            sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha 2>/dev/null | cut -c1-7)" || continue
            [ -n "$sha" ] || continue
            body="$(gh api "repos/$GITHUB_REPOSITORY/releases/$id" --jq .body)"
            new="$(printf '%s' "$body" | sed -E "s/commit [0-9a-f]{7}([^0-9a-f]|$)/commit ${sha}\1/")"
            if [ "$new" != "$body" ]; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
                -f body="$new" >/dev/null
              echo "$tag now cites commit $sha"
            fi
          done

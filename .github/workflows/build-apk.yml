name: Build Android APK

# Builds the FEXT client into an installable debug .apk with Buildozer, running
# directly on an ubuntu-latest runner (GitHub runners can reach the Android SDK
# host dl.google.com that Buildozer downloads from). The finished APK is
# uploaded as a workflow artifact you can download from the run's Summary page.

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build-android:
    name: Buildozer (debug APK)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache git zip unzip autoconf automake libtool \
            libltdl-dev pkg-config zlib1g-dev libncurses-dev cmake \
            libffi-dev libssl-dev
          # autoconf + automake (aclocal) + libltdl-dev (LT_SYS_SYMBOL_USCORE)
          # are all required to autoreconf libffi (a cffi/cryptography dep).

      - name: Install Rust (required by the cryptography recipe)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install "buildozer==1.5.0" "cython==0.29.33"

      - name: Cache Buildozer SDK/NDK and p4a
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Build the debug APK
        run: buildozer android debug

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fext-debug-apk
          path: bin/*.apk
          if-no-files-found: error

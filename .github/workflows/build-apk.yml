name: Build Android APK

# Tests first, then a release-signed .apk built with Buildozer on an
# ubuntu-latest runner (GitHub runners can reach the Android SDK host
# dl.google.com that Buildozer downloads from), then a GitHub Release that
# carries both deliverables: the Android APK and the desktop Python client.
# Every branch is tested and built; only the default branch publishes, so a
# copy of the code pushed elsewhere never replaces a release's files.
#
# Signing:
#   * If you set the repo secrets FEXT_KEYSTORE_B64 / FEXT_KEYSTORE_PASSWORD /
#     FEXT_KEY_ALIAS / FEXT_KEY_PASSWORD, the release is signed with THAT
#     keystore (a persistent key you own — required so future updates install
#     over this one; this is the proper production setup).
#   * Otherwise the workflow generates an ephemeral keystore just for the build,
#     so you still get a properly release-signed, installable APK. No key
#     material is ever committed to the repo.

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write        # needed to create/update the GitHub Release

jobs:
  tests:
    name: Client test suites (headless)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (with tags, for the previous-release compatibility tests)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install a virtual display and the client's dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1 libgl1-mesa-dri libmtdev1 xclip
          python -m pip install --upgrade pip
          pip install "kivy[base]==2.3.1" requests urllib3 charset-normalizer \
            idna certifi websocket-client cryptography qrcode pillow

      - name: Version in main.py matches buildozer.spec
        run: |
          SPEC=$(grep -E '^version' buildozer.spec | head -1 | sed -E 's/.*=[[:space:]]*//')
          CODE=$(grep -E '^APP_VERSION = ' main.py | sed -E 's/.*"(.*)".*/\1/')
          echo "spec=$SPEC main.py=$CODE"
          test "$SPEC" = "$CODE"

      - name: Run the suites
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          # The newest release tag before this version: compatibility is
          # checked against that release's REAL code, in both directions.
          OLD=""
          PREV=$(git tag --list 'v*' --sort=-v:refname | head -1 || true)
          if [ -n "$PREV" ] && git show "$PREV:main.py" > "$RUNNER_TEMP/old_main.py" 2>/dev/null; then
            OLD="$RUNNER_TEMP/old_main.py"; echo "compatibility baseline: $PREV"
          fi
          python desktop/test_service.py main.py
          xvfb-run -a python desktop/test_core.py main.py $OLD
          xvfb-run -a python desktop/test_flows.py main.py
          xvfb-run -a python desktop/test_design.py main.py
          xvfb-run -a python desktop/test_composer.py main.py
          xvfb-run -a python desktop/test_bundle.py main.py
          xvfb-run -a python desktop/smoke_desktop.py main.py
          xvfb-run -a python desktop/smoke_chat.py main.py

  build-android:
    name: Buildozer (release APK)
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache git zip unzip autoconf automake libtool \
            libltdl-dev pkg-config zlib1g-dev libncurses-dev cmake \
            libffi-dev libssl-dev
          # autoconf + automake (aclocal) + libltdl-dev (LT_SYS_SYMBOL_USCORE)
          # are all required to autoreconf libffi (a cffi/cryptography dep).

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install "buildozer==1.5.0" "cython==0.29.33"

      - name: Cache Buildozer SDK/NDK and p4a
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Pre-fetch FreeType from either of its official hosts
        run: |
          set -euo pipefail
          # python-for-android downloads FreeType from download.savannah.gnu.org
          # alone, and a build has failed after 11 minutes on that host being
          # unreachable. Seed its download cache (the file plus the .mark-
          # file that tells it the download completed) from savannah or from
          # SourceForge, FreeType's other official host — pinned by sha256,
          # so either host is enough and neither has to be trusted blindly.
          ARCHS="$(grep -E '^android.archs' buildozer.spec | sed -E 's/.*=//; s/[[:space:]]//g; s/,/_/g')"
          PKG=".buildozer/android/platform/build-${ARCHS}/packages/freetype"
          FILE="freetype-2.10.1.tar.gz"
          SHA="3a60d391fd579440561bf0e7f31af2222bc610ad6ce4d9d7bd2165bca8669110"
          mkdir -p "$PKG"
          for URL in "https://download.savannah.gnu.org/releases/freetype/$FILE" \
                     "https://sourceforge.net/projects/freetype/files/freetype2/2.10.1/$FILE/download"; do
            if curl -fsSL --retry 3 --connect-timeout 20 --max-time 300 -o "$PKG/$FILE" "$URL" \
                && echo "$SHA  $PKG/$FILE" | sha256sum -c --quiet -; then
              touch "$PKG/.mark-$FILE"
              echo "FreeType $FILE from $URL (sha256 verified)"
              exit 0
            fi
            rm -f "$PKG/$FILE"
          done
          echo "::warning::Could not pre-fetch FreeType; python-for-android will try savannah itself"

      - name: Build & sign the release APK
        env:
          FEXT_KEYSTORE_B64: ${{ secrets.FEXT_KEYSTORE_B64 }}
          FEXT_KEYSTORE_PASSWORD: ${{ secrets.FEXT_KEYSTORE_PASSWORD }}
          FEXT_KEY_ALIAS: ${{ secrets.FEXT_KEY_ALIAS }}
          FEXT_KEY_PASSWORD: ${{ secrets.FEXT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/fext-release.keystore"
          if [ -n "${FEXT_KEYSTORE_B64:-}" ]; then
            echo "::notice::Signing with the keystore from repository secrets (persistent key)."
            # A pasted secret can carry line breaks, spaces or a Windows CR
            # (PowerShell, Notepad); none of them is base64, so drop them.
            if ! printf '%s' "$FEXT_KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > "$KS" 2>/dev/null; then
              echo "::error::FEXT_KEYSTORE_B64 is not valid base64. Encode the .keystore file again (README: Release signing)."
              exit 1
            fi
            STOREPASS="$(printf '%s' "${FEXT_KEYSTORE_PASSWORD:-}" | tr -d '\r\n')"
            KEYPASS="$(printf '%s' "${FEXT_KEY_PASSWORD:-${FEXT_KEYSTORE_PASSWORD:-}}" | tr -d '\r\n')"
            ALIAS="$(printf '%s' "${FEXT_KEY_ALIAS:-fext}" | tr -d ' \r\n\t')"
            # Fail in seconds, naming the secret to fix, not after the build.
            . tools/check_keystore.sh
            check_keystore "$KS" "$ALIAS"
          else
            echo "::warning::No signing secrets set - generating an ephemeral keystore for this build. Add FEXT_KEYSTORE_B64/PASSWORD/ALIAS secrets for a persistent key so future updates install over this release."
            STOREPASS="$(openssl rand -hex 24)"
            KEYPASS="$STOREPASS"
            ALIAS="fext"
            keytool -genkeypair -v -keystore "$KS" -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STOREPASS" -keypass "$KEYPASS" \
              -dname "CN=FEXT Client, OU=FEXT, O=FEXT, C=SG"
          fi
          export P4A_RELEASE_KEYSTORE="$KS"
          export P4A_RELEASE_KEYSTORE_PASSWD="$STOREPASS"
          export P4A_RELEASE_KEYALIAS="$ALIAS"
          export P4A_RELEASE_KEYALIAS_PASSWD="$KEYPASS"
          buildozer android release
          echo "Built:"; ls -la bin/

      - name: Name the deliverables
        id: assets
        run: |
          set -euo pipefail
          VER="$(grep -E '^version' buildozer.spec | head -1 | sed -E 's/.*=[[:space:]]*//')"
          TITLE="$(grep -E '^title' buildozer.spec | head -1 | sed -E 's/.*=[[:space:]]*//')"
          mkdir -p release
          cp "$(ls bin/*-release.apk | head -1)" "release/${TITLE}-${VER}.apk"
          # The desktop client is main.py with its fonts and window icons
          # appended (Kivy cannot fall back to another font, so without the
          # bundled serif a computer shows no emoji) — then checked against
          # main.py and data/ byte for byte, as anyone can check it.
          python3 tools/bundle_desktop.py "release/${TITLE}-${VER}-desktop.py"
          python3 tools/bundle_desktop.py --verify "release/${TITLE}-${VER}-desktop.py"
          ls -la release/
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Upload the deliverables as a workflow artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ferritext-release
          path: release/*
          if-no-files-found: error

      - name: Publish to a GitHub Release
        # Only from the default branch: a mirror branch (main, kept in step
        # by hand) builds the same tree and must not replace these files.
        if: success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.assets.outputs.ver }}
          TITLE: ${{ steps.assets.outputs.title }}
        run: |
          set -euo pipefail
          TAG="v${VER}"
          NOTES="${TITLE} ${VER} (CI run #${{ github.run_number }}, commit ${GITHUB_SHA:0:7}). ${TITLE}-${VER}.apk: Android — sideload via 'Install unknown apps'. ${TITLE}-${VER}-desktop.py: the same client for Windows, macOS and Linux in one file, with its fonts and icons inside — run it with Python 3.11+ (see the README for the packages it needs)."
          # Create the release if this tag is new; otherwise keep it and just
          # refresh the title/notes, so a rebuild of the same version does not
          # leave stale text (or a stale app name) on the downloads page.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE $TAG" --notes "$NOTES"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "$TITLE $TAG" --notes "$NOTES"
          fi
          gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
          echo "Published to release $TAG:"; ls release/

      - name: Keep every release's commit citation on its tag
        if: success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Each release's notes name the commit it was built from. Should
          # history ever be rewritten (tags moved onto rewritten commits),
          # this points each one at its tag's commit again. Idempotent.
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq '.[] | [.id, .tag_name] | @tsv' |
          while IFS=$'\t' read -r id tag; do
            sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha 2>/dev/null | cut -c1-7)" || continue
            [ -n "$sha" ] || continue
            body="$(gh api "repos/$GITHUB_REPOSITORY/releases/$id" --jq .body)"
            new="$(printf '%s' "$body" | sed -E "s/commit [0-9a-f]{7}([^0-9a-f]|$)/commit ${sha}\1/")"
            if [ "$new" != "$body" ]; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
                -f body="$new" >/dev/null
              echo "$tag now cites commit $sha"
            fi
          done

# The APK on the next platform, on trial (16.0): buildozer.spec's [app@next]
# profile — python-for-android 2026.5.9 with our own builds of OpenSSL,
# cryptography, libjpeg-turbo, libpng, libwebp and Pillow
# (tools/apk-next/recipes). A debug APK, published nowhere: an artifact to
# install on phones. It runs when what it builds from changes, or by hand
# (Actions, Run workflow). Releases stay with build-apk.yml until this build
# has passed on phones.
name: APK on the next platform (trial)

on:
  push:
    branches: [main]
    paths:
      - "tools/apk-next/**"
      - ".github/workflows/apk-next.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-next-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk-next:
    name: Buildozer, next platform (debug APK)
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache git zip unzip autoconf automake libtool \
            libltdl-dev pkg-config zlib1g-dev libncurses-dev cmake \
            libffi-dev libssl-dev

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          # Buildozer 1.6.0 came with python-for-android 2026.5.9.
          pip install "buildozer==1.6.0" "cython==0.29.37"

      - name: Cache Buildozer SDK/NDK
        uses: actions/cache@v5
        with:
          path: ~/.buildozer
          key: buildozer-next-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-next-${{ runner.os }}-

      - name: Pre-fetch FreeType from either of its official hosts
        run: |
          bash tools/seed_download.sh freetype freetype-2.14.1.tar.gz \
            174d9e53402e1bf9ec7277e22ec199ba3e55a6be2c0740cb18c0ee9850fc8c34 \
            https://download.savannah.gnu.org/releases/freetype/freetype-2.14.1.tar.gz \
            https://sourceforge.net/projects/freetype/files/freetype2/2.14.1/freetype-2.14.1.tar.gz/download

      - name: Build the debug APK
        env:
          # Why pip is held back: the file itself.
          PIP_CONSTRAINT: ${{ github.workspace }}/tools/apk-next/pip-constraints.txt
        run: |
          set -euo pipefail
          # python-for-android reads one folder of recipes: ours for calls too.
          cp -r recipes/libopus tools/apk-next/recipes/
          buildozer --profile next android debug
          ls -la bin/

      - name: What went in
        run: |
          set -euo pipefail
          echo "Sources downloaded:"
          find .buildozer/android/platform/build-*/packages -mindepth 2 -maxdepth 2 \
            -type f ! -name '.mark-*' -printf '%P\n' | sort
          echo "Native libraries in the APK:"
          unzip -l bin/*-debug.apk | grep -E '\.so$' | awk '{print $4}' | sort

      - name: Upload the APK
        uses: actions/upload-artifact@v6
        with:
          name: ferritext-next-debug-apk
          path: bin/*-debug.apk
          if-no-files-found: error
          retention-days: 7

      # The build tree in the workspace (several GB) is done with: without
      # this the runner's disk is full when the SDK and NDK cache is saved
      # (run 4: "No space left on device"), and every build starts cold.
      - name: Free the disk for the cache
        if: always()
        run: rm -rf .buildozer/android/platform/build-*
